[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ctx-context"
version = "0.1.0"
description = "Local, provenance-first context infrastructure for Markdown knowledge bases"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ctx contributors" }]
dependencies = [
  "markdown-it-py>=4.0,<5",
  "numpy>=2.2,<3",
  "pydantic>=2.11,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.7,<1"]
mcp = ["mcp>=1.20,<3"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
all = ["ctx-context[embeddings,mcp]"]

[project.scripts]
ctx = "ctx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ctx"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ctx"]

[tool.coverage.run]
source = ["ctx"]
branch = true
